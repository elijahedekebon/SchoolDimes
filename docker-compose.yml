services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schooldimes
      POSTGRES_PASSWORD: schooldimes
      POSTGRES_DB: schooldimes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schooldimes"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput -v 0 && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    # Wait until `web` has applied migrations: the DatabaseScheduler reads its
    # tables (and installs CELERY_BEAT_SCHEDULE) the moment it starts.
    command:
      - sh
      - -c
      - >-
        until python manage.py migrate --check >/dev/null 2>&1;
        do echo "celery-beat waiting for migrations"; sleep 3; done;
        exec celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
