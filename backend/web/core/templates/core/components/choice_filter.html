{% load i18n %}<label class="field field-xs" style="width:180px"><span class="label">{{ label }}</span>
  <select class="input" name="{{ name }}">
    <option value="">{% translate "All" %}</option>
    {% for v, l in options %}<option value="{{ v }}"{% if v|stringformat:"s" == value|stringformat:"s" %} selected{% endif %}>{{ l }}</option>{% endfor %}
  </select></label>
